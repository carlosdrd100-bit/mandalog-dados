<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Carregamentos Mandalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#12182B; --ink-2:#4B536B; --line:#D8DCE6;
  --navy:#143A6B; --or:#EE7D22; --or-ink:#FFFFFF; --focus:#2C40C4;
  --ok:#14803F; --ok-bg:#DBF2E3; --warn:#9A6200; --warn-bg:#FFEFC7; --bad:#B42525; --bad-bg:#FADADA; --info:#1B4F8F; --info-bg:#E2E7FB;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D111B; --surface:#161C2B; --surface-2:#1C2335; --ink:#E7EBF5; --ink-2:#9BA5BF; --line:#29324A;
    --navy:#14275A; --or:#F59A4B; --or-ink:#0D111B; --focus:#8493F7;
    --ok:#52C885; --ok-bg:#12301F; --warn:#F0B441; --warn-bg:#3A2B09; --bad:#F27676; --bad-bg:#3D1616; --info:#9DB7E8; --info-bg:#1E2848;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D111B; --surface:#161C2B; --surface-2:#1C2335; --ink:#E7EBF5; --ink-2:#9BA5BF; --line:#29324A;
  --navy:#14275A; --or:#F59A4B; --or-ink:#0D111B; --focus:#8493F7;
  --ok:#52C885; --ok-bg:#12301F; --warn:#F0B441; --warn-bg:#3A2B09; --bad:#F27676; --bad-bg:#3D1616; --info:#9DB7E8; --info-bg:#1E2848;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.hdr{background:var(--navy);color:#fff;border-bottom:5px solid var(--or);border-radius:12px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.logo{background:#fff;border-radius:8px;padding:4px 12px;display:flex;align-items:center;min-height:56px}
.logo img{display:block;max-height:56px;max-width:200px;width:auto;height:auto}
.hdr-t{flex:1 1 240px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#F6B27A}
.hdr-t h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.01em}
.hbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 12px;font-weight:500}
.hbtn:hover{background:rgba(255,255,255,.2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;color:var(--navy);margin-bottom:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card h2{color:var(--info)}}
:root[data-theme="dark"] .card h2{color:var(--info)}
.hint{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
input{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input.mono{font-family:var(--f-mono)}
.btn{border:1px solid var(--or);background:var(--or);color:var(--or-ink);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.msg.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sep{height:1px;background:var(--line);margin:16px 0}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pl{font-family:var(--f-mono);font-weight:500}
.w{font-size:13px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.w b{color:var(--ink);font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.sim,.badge.env{background:var(--info-bg);color:var(--info);border-color:transparent}
.badge.ign,.badge.pend{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.empty{padding:14px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.gate{max-width:420px;margin:24px auto;width:100%}
footer{font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.hdr-t h1{font-size:28px}.row{grid-template-columns:1fr auto}.row .w{grid-column:1 / -1;order:3}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(function(){
'use strict';

/* Painel de AUTOMACAO: nao le nenhum dado de planos do GM7. So envia pedidos (vincular / iniciar rota)
   e mostra o andamento deles. */
var WORKER_URL='https://mandalog-painel.carlos-eduardo-c87.workers.dev';
var RESULT_URL='acoes.enc.json';
var LOGO='https://mandalogcel-wq.github.io/mandalog-torre/assets/mandalog.png';
var LS_PASS='mandalog-painel-senha-v1', LS_PROG='mandalog-programacao-v1';
var STATUS={OK:['ok','Vinculado'],SIMULADO:['sim','Simulação'],IGNORADO:['ign','Não alterado'],PENDENTE:['pend','Aguardando liberação'],ERRO:['err','Erro'],ENVIADO:['env','Enviado ao robô']};

var S={view:'gate',err:'',pass:'',acoes:[],enviados:[],msg:'',msgOk:false,busy:false,prog:progGet(),poll:null};
var root=document.getElementById('root');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function progGet(){try{var v=JSON.parse(lsGet(LS_PROG)||'{}');return {quem:v.quem||'',senha:v.senha||''};}catch(e){return {quem:'',senha:''};}}
function progSet(){lsSet(LS_PROG,JSON.stringify(S.prog));}
function novoId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(String(Date.now())+Math.random().toString(16).slice(2));}

/* ---------- criptografia (mesmo formato do robo: PBKDF2-SHA256 + AES-256-GCM) ---------- */
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function decrypt(env,pass){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(env.s),iterations:env.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.n)},key,b64(env.c));})
  .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}

/* ---------- andamento dos pedidos ---------- */
function carrega(){
  if(!S.pass)return;
  fetch(RESULT_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.status===200?r.json():null;}).then(function(env){
    if(!env){S.acoes=[];render();return;}
    return decrypt(env,S.pass).then(function(d){S.acoes=(d&&d.resultados)||[];render();},function(){
      lsSet(LS_PASS,'');S.pass='';S.view='gate';S.err='Senha incorreta.';render();});
  }).catch(function(){});
}
function agenda(){if(S.poll)clearInterval(S.poll);S.poll=setInterval(function(){if(S.view==='ok')carrega();},20000);}

/* ---------- envio ---------- */
function enviar(tipo,d,limpar){
  if(!S.prog.quem||!S.prog.senha){S.msg='Informe seu nome e a senha de programação.';S.msgOk=false;render();return;}
  var id=novoId(),body=Object.assign({tipo:tipo,id:id,senha:S.prog.senha,quem:S.prog.quem},d);
  S.busy=true;S.msg='Enviando…';S.msgOk=false;render();
  fetch(WORKER_URL.replace(/\/$/,'')+'/acao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      S.busy=false;
      if(x.j&&x.j.ok){S.enviados.unshift({id:id,tipo:tipo,plano:d.plano});S.msg='Pedido enviado. O resultado aparece em "Andamento" em instantes.';S.msgOk=true;S.limpar=limpar;
        [15000,35000,70000].forEach(function(t){setTimeout(carrega,t);});}
      else{S.msg='Não enviado: '+((x.j&&x.j.erro)||('HTTP '+x.s));S.msgOk=false;}
      render();})
    .catch(function(){S.busy=false;S.msg='Não consegui falar com o endpoint.';S.msgOk=false;render();});
}

/* ---------- telas ---------- */
function header(extra){
  return '<header class="hdr"><div class="logo"><img src="'+LOGO+'" alt="Mandalog Operações Logísticas"></div>'+
    '<div class="hdr-t"><p class="eyebrow">Operações Logísticas · automação GM7Driver</p><h1>Carregamentos Mandalog</h1></div>'+(extra||'')+'</header>';
}
function andamento(){
  var ids={};S.acoes.forEach(function(a){ids[a.id]=1;});
  var pend=S.enviados.filter(function(e){return !ids[e.id];}).map(function(e){return {tipo:e.tipo,plano:e.plano,status:'ENVIADO',motivo:'aguardando o robô',quando:'',quem:''};});
  var lista=pend.concat(S.acoes.slice().reverse()).slice(0,10);
  var h='<section class="card"><h2>Andamento</h2><p class="hint">Resultado dos pedidos enviados ao robô. Atualiza sozinho.</p>';
  if(!lista.length)return h+'<div class="empty">Nenhum lançamento ainda.</div></section>';
  return h+'<div class="list">'+lista.map(function(a){
    var st=STATUS[a.status]||['pend',a.status||'–'];
    return '<div class="row"><span class="pl">'+esc(a.plano)+'</span><span class="w"><b>'+(a.tipo==='iniciar'?'Iniciar rota':'Vincular')+'</b> · '+esc(a.motivo||'')+(a.quem?' · '+esc(a.quem):'')+(a.quando?' · '+esc(String(a.quando).slice(8,10)+'/'+String(a.quando).slice(5,7)+' '+String(a.quando).slice(11,16)):'')+'</span><span class="badge '+st[0]+'">'+esc(st[1])+'</span></div>';}).join('')+'</div></section>';
}
function render(){
  var foco=document.activeElement&&document.activeElement.id,keep={};
  ['pPlano','pMot','pPlaca','sPlano','pQuem','pSenha','pw'].forEach(function(id){var e=document.getElementById(id);if(e)keep[id]=e.value;});
  if(S.view==='gate'){
    root.innerHTML=header()+'<section class="card gate"><h2>Entrar</h2><p class="hint">Digite a senha do painel para ver o andamento dos pedidos.</p>'+
      '<form id="gateForm"><label>Senha<input id="pw" type="password" autocomplete="current-password" autofocus></label>'+
      (S.err?'<p class="msg bad" role="alert">'+esc(S.err)+'</p>':'')+
      '<p style="margin-top:12px"><button class="btn" type="submit">Entrar</button></p></form></section>';
    return;
  }
  var off=S.busy?' disabled':'';
  root.innerHTML=header('<button class="hbtn" data-act="sair">Sair</button>')+
    '<section class="card"><h2>Identificação</h2><p class="hint">Quem está lançando. Fica salvo neste navegador.</p><div class="grid">'+
      '<label>Seu nome<input id="pQuem" maxlength="40" autocomplete="off" value="'+esc(S.prog.quem)+'"></label>'+
      '<label>Senha de programação<input id="pSenha" type="password" autocomplete="off" value="'+esc(S.prog.senha)+'"></label></div></section>'+
    '<section class="card"><h2>Lançar plano</h2><p class="hint">Informe o número do plano (código da rota no GM7, 10 dígitos), o motorista e a placa. O robô vincula na rota do GM7Driver e nunca sobrescreve o que já está vinculado.</p>'+
      '<form id="lancarForm"><div class="grid">'+
      '<label>Nº do plano<input id="pPlano" class="mono" inputmode="numeric" placeholder="ex.: 6103333346" maxlength="40" required></label>'+
      '<label>Motorista<input id="pMot" placeholder="nome como está no GM7" maxlength="80" required></label>'+
      '<label>Placa<input id="pPlaca" class="mono" placeholder="ABC1D23" maxlength="8" required></label>'+
      '<div><button class="btn" type="submit"'+off+'>Lançar e vincular</button></div></div></form>'+
      '<div class="sep"></div>'+
      '<h2 style="font-size:20px">Iniciar rota</h2><p class="hint">Dá o início da rota no GM7Driver. Só funciona se a rota já tiver motorista e placa.</p>'+
      '<form id="iniciarForm"><div class="grid">'+
      '<label>Nº do plano<input id="sPlano" class="mono" inputmode="numeric" placeholder="ex.: 6103333346" maxlength="40" required></label>'+
      '<div><button class="btn ghost" type="submit"'+off+'>▶ Iniciar rota</button></div></div></form>'+
      (S.msg?'<p class="msg'+(S.msgOk?' ok':(S.busy?'':' bad'))+'" role="status">'+esc(S.msg)+'</p>':'')+'</section>'+
    andamento()+
    '<footer>Os dados dos planos ficam no GM7. Este painel só envia os pedidos e mostra o resultado.</footer>';
  Object.keys(keep).forEach(function(id){var e=document.getElementById(id);if(e&&keep[id]!=='')e.value=keep[id];});
  if(S.limpar){['pPlano','pMot','pPlaca','sPlano'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});S.limpar=false;}
  if(foco){var f=document.getElementById(foco);if(f&&f.focus)f.focus();}
}

/* ---------- eventos ---------- */
function guarda(){var q=document.getElementById('pQuem'),s=document.getElementById('pSenha');if(q)S.prog.quem=q.value.trim();if(s)S.prog.senha=s.value;progSet();}
root.addEventListener('click',function(ev){var b=ev.target.closest('[data-act]');if(b&&b.getAttribute('data-act')==='sair'){lsSet(LS_PASS,'');S.pass='';S.acoes=[];S.view='gate';S.err='';render();}});
root.addEventListener('submit',function(ev){
  ev.preventDefault();var id=ev.target.id;
  if(id==='gateForm'){var v=document.getElementById('pw').value;if(!v)return;S.pass=v;S.err='';lsSet(LS_PASS,v);S.view='ok';render();carrega();agenda();return;}
  guarda();
  if(id==='lancarForm'){
    var plano=document.getElementById('pPlano').value.trim(),mot=document.getElementById('pMot').value.trim(),placa=document.getElementById('pPlaca').value.trim().toUpperCase();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(plano)){S.msg='Número do plano inválido.';S.msgOk=false;render();return;}
    if(mot.length<3){S.msg='Informe o motorista.';S.msgOk=false;render();return;}
    if(!/^[A-Z]{3}-?[0-9][A-Z0-9][0-9]{2}$/.test(placa)){S.msg='Placa inválida (ex.: ABC1D23).';S.msgOk=false;render();return;}
    enviar('vincular',{plano:plano,motorista:mot,placa:placa},true);return;}
  if(id==='iniciarForm'){
    var p2=document.getElementById('sPlano').value.trim();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(p2)){S.msg='Número do plano inválido.';S.msgOk=false;render();return;}
    if(!confirm('Iniciar a rota do plano '+p2+'?\nIsso registra o início da rota no GM7 e não pode ser desfeito por aqui.'))return;
    enviar('iniciar',{plano:p2},true);}
});

S.pass=lsGet(LS_PASS);
if(S.pass){S.view='ok';render();carrega();agenda();}else render();
})();
</script>
</body>
</html>
