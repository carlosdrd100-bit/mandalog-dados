<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mandalog Controle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#12182B; --ink-2:#4B536B; --line:#D8DCE6;
  --navy:#143A6B; --or:#EE7D22; --or-ink:#FFFFFF; --focus:#2C40C4;
  --ok:#14803F; --ok-bg:#DBF2E3; --warn:#9A6200; --warn-bg:#FFEFC7; --bad:#B42525; --bad-bg:#FADADA; --info:#1B4F8F; --info-bg:#E2E7FB;
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D111B; --surface:#161C2B; --surface-2:#1C2335; --ink:#E7EBF5; --ink-2:#9BA5BF; --line:#29324A;
    --navy:#14275A; --or:#F59A4B; --or-ink:#0D111B; --focus:#8493F7;
    --ok:#52C885; --ok-bg:#12301F; --warn:#F0B441; --warn-bg:#3A2B09; --bad:#F27676; --bad-bg:#3D1616; --info:#9DB7E8; --info-bg:#1E2848;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D111B; --surface:#161C2B; --surface-2:#1C2335; --ink:#E7EBF5; --ink-2:#9BA5BF; --line:#29324A;
  --navy:#14275A; --or:#F59A4B; --or-ink:#0D111B; --focus:#8493F7;
  --ok:#52C885; --ok-bg:#12301F; --warn:#F0B441; --warn-bg:#3A2B09; --bad:#F27676; --bad-bg:#3D1616; --info:#9DB7E8; --info-bg:#1E2848;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11' 1,'ss01' 1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.hdr{background:var(--navy);color:#fff;border-bottom:5px solid var(--or);border-radius:12px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.logo{background:#fff;border-radius:8px;padding:4px 12px;display:flex;align-items:center;min-height:56px}
.logo img{display:block;max-height:56px;max-width:200px;width:auto;height:auto}
.hdr-t{flex:1 1 240px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#F6B27A}
.hdr-t h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.hdr-t h1 span{color:#fff}.hdr-t h1 em{font-style:normal;color:var(--or);text-shadow:0 0 26px rgba(255,122,0,.45)}
.hbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 12px;font-weight:500}
.hbtn:hover{background:rgba(255,255,255,.2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--navy);margin-bottom:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card h2{color:var(--info)}}
:root[data-theme="dark"] .card h2{color:var(--info)}
.hint{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
input{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input.mono{font-family:var(--f-mono)}
.btn{border:1px solid var(--or);background:var(--or);color:var(--or-ink);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.msg.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sep{height:1px;background:var(--line);margin:16px 0}
.sel{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input[type=date]{color-scheme:light dark}
.ops{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pl{font-family:var(--f-mono);font-weight:500}
.w{font-size:13px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.w b{color:var(--ink);font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.sim,.badge.env{background:var(--info-bg);color:var(--info);border-color:transparent}
.badge.ign,.badge.pend{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.empty{padding:14px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.gate{max-width:420px;margin:24px auto;width:100%}
.modal{position:fixed;inset:0;z-index:5000;background:rgba(10,14,26,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-box{max-height:calc(100dvh - 32px);overflow-y:auto}
.modal-box{background:var(--surface);color:var(--ink);border:2px solid var(--bad);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.modal-box h2{font-family:var(--f-display);font-size:25px;letter-spacing:-.01em;color:var(--bad);margin-bottom:8px}
.modal-box .dado{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px;overflow-wrap:anywhere}
.modal-box .dado b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.modal-box .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn.perigo{background:var(--bad);border-color:var(--bad);color:#fff}
.sla-banner{background:var(--bad);color:#fff;border-radius:12px;padding:14px 18px;font-weight:600;font-size:17px;border:2px solid #7d1313}
.sla-banner small{display:block;font-weight:400;font-size:13px;opacity:.95;margin-top:2px}
.sla-ok{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 16px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{border-radius:10px;padding:10px 12px;text-align:center;border:1px solid var(--line);background:var(--surface-2)}
.kpi b{display:block;font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi.k-est{background:var(--bad-bg);color:var(--bad)}.kpi.k-ale{background:var(--warn-bg);color:var(--warn)}.kpi.k-pra{background:var(--ok-bg);color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:4px 12px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);border-left:5px solid var(--line)}
.prow.f-est{border-left-color:var(--bad);background:var(--bad-bg)}.prow.f-ale{border-left-color:var(--warn);background:var(--warn-bg)}.prow.f-pra{border-left-color:var(--ok)}
.prow .h{font-family:var(--f-display);font-size:21px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow.f-est .h{color:var(--bad)}.prow.f-ale .h{color:var(--warn)}
.sla-banner.amb{background:var(--warn);color:#fff;border-color:#6b4500}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-top:2px}
.tab{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:16px;padding:10px 16px;border-bottom:4px solid transparent;margin-bottom:-2px;min-height:44px}
.tab.on{color:var(--navy);border-bottom-color:var(--or)}
:root[data-theme="dark"] .tab.on{color:var(--info)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on{color:var(--info)}}
.chip.sm{padding:5px 11px;min-height:34px;font-size:13px}
.tag{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.mcard b{font-family:var(--f-display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.mcard .mt{font-size:12px;font-weight:600;color:var(--ink-2)}.mcard .mm{font-size:12px;color:var(--ink-2)}
.mcard.m-ok{background:var(--ok-bg);color:var(--ok)}.mcard.m-bad{background:var(--bad-bg);color:var(--bad)}
.mcard.m-ok .mt,.mcard.m-ok .mm,.mcard.m-bad .mt,.mcard.m-bad .mm{color:inherit}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:12px;overflow-x:auto;padding-bottom:30px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:44px;position:relative}
.bar .bv{width:100%;background:var(--or);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bar .bv span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:700}
.bar small{position:absolute;bottom:-30px;font-size:10px;color:var(--ink-2);text-align:center;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px;display:inline-flex;gap:8px;align-items:center}
.chip b{background:var(--surface-2);border-radius:999px;padding:1px 8px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.on b{background:rgba(255,255,255,.2)}
.chip.red:not(.on){border-color:var(--bad)}.chip .dot{font-size:11px;font-weight:700;color:var(--bad)}.chip.on .dot{color:#FFD0D0}
.opx{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:520px){.prow{grid-template-columns:1fr auto}.prow .w{grid-column:1 / -1;order:3}.kpi b{font-size:30px}}
/* ---------- central de pendencias: preto + laranja Mandalog, mapa em tela cheia ---------- */
body.cc{--bg:#070707;--surface:#121212;--surface-2:#1A1A1A;--ink:#F4EEE8;--ink-2:#A89F96;--line:#2B2520;--navy:#0E0E0E;--or:#FF7A00;--or-ink:#0A0A0A;--focus:#FFB066;
  --bad:#FF5A3C;--bad-bg:#3B1511;--warn:#FFB020;--warn-bg:#33260A;--ok:#4ADE80;--ok-bg:#10281A;--info:#FFB066;--info-bg:#2A1B0C;color-scheme:dark;padding:10px 12px 12px}
body.cc .wrap{max-width:none;gap:10px}
body.cc .hdr{background:linear-gradient(135deg,#0E0E0E 0%,#17100A 60%,#26140A 100%)}
body.cc .hdr .hbtn{margin-left:0}
.live{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:500;background:rgba(0,0,0,.35);color:var(--ink-2);white-space:nowrap}
.live b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80;animation:pingv 2s ease-out infinite}
.live.old{border-color:#6b4500;color:#F0B441}.live.old i{background:#F0B441;animation:none}
@keyframes pingv{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}80%,100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
@keyframes subir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim .ixk,.anim .cc-kpi,.anim .ixcard,.anim .lc-col>.card,.anim .cc-side{animation:subir .42s cubic-bezier(.2,.7,.2,1) both}
.anim .ixk:nth-child(2),.anim .cc-kpi:nth-child(2){animation-delay:.05s}.anim .ixk:nth-child(3),.anim .cc-kpi:nth-child(3){animation-delay:.1s}
.anim .ixk:nth-child(4),.anim .cc-kpi:nth-child(4){animation-delay:.15s}.anim .ixk:nth-child(5){animation-delay:.2s}.anim .ixk:nth-child(6){animation-delay:.25s}
@media (max-width:520px){body.cc .hdr{padding:8px 12px;gap:6px 10px}body.cc .hdr-t{flex-basis:150px}body.cc .hdr-t h1{font-size:24px}.live{font-size:11px;padding:5px 10px}}
@media (prefers-reduced-motion:reduce){.anim *,.live i{animation:none!important}}
body.cc .hdr{padding:6px 14px;border-radius:10px;background:#0E0E0E;border:1px solid var(--line);border-bottom:3px solid var(--or)}
body.cc .logo{min-height:40px;padding:3px 10px}body.cc .logo img{max-height:36px}
body.cc .hdr-t h1{font-size:26px}body.cc .eyebrow{color:var(--or)}
body.cc .tab.on{color:var(--or);border-bottom-color:var(--or)}
body.cc .chip{background:#141414;border-color:var(--line)}
body.cc .chip.on{background:var(--or);color:#0A0A0A;border-color:var(--or)}body.cc .chip.on b{background:rgba(0,0,0,.25);color:#0A0A0A}
body.cc .chip.red:not(.on){border-color:var(--bad)}
body.cc footer{display:none}
.cc-main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;height:calc(100dvh - 168px);min-height:560px}
.cc-left{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.cc-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.cc-bar .chips{margin:0}
.cc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cc-kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;align-items:baseline;gap:10px}
.cc-kpi b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cc-kpi span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.cc-kpi.k1{border-left-color:var(--bad)}.cc-kpi.k1 b{color:var(--bad)}.cc-kpi.k2{border-left-color:var(--warn)}.cc-kpi.k2 b{color:var(--warn)}
.cc-kpi.k3{border-left-color:var(--ok)}.cc-kpi.k3 b{color:var(--ok)}.cc-kpi.k4{border-left-color:var(--or)}.cc-kpi.k4 b{color:var(--or)}
.cc-map{isolation:isolate;z-index:0;flex:1;min-height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:#050505}
#mapa{position:absolute;inset:0}
.cc-leg{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(10,10,10,.88);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.cc-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cc-side{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cc-sh{padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--or)}
.cc-sh small{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;letter-spacing:0;color:var(--ink-2)}
.cc-list{overflow:auto;flex:1}
.vc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);border-left:5px solid var(--line);cursor:pointer}
.vc:hover{background:var(--surface-2)}.vc.sel{background:#241609;border-left-color:var(--or)}
.vc.f-est{border-left-color:var(--bad)}.vc.f-ale{border-left-color:var(--warn)}.vc.f-pra{border-left-color:var(--ok)}
.vc .pt{font-family:var(--f-mono);font-weight:600;font-size:17px;color:var(--or);letter-spacing:.01em}
.vc .h{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1;text-align:right;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vc.f-est .h{color:var(--bad)}.vc.f-ale .h{color:var(--warn)}.vc.f-pra .h{color:var(--ok)}
.vc .w{grid-column:1 / -1;font-size:12.5px}
.pinw{background:none;border:0}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.pin .pt{background:#FF7A00;color:#0A0A0A;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:600;font-size:11.5px;letter-spacing:.02em;padding:3px 7px;border-radius:6px;border:2px solid #0A0A0A;box-shadow:0 0 0 1.5px #FF7A00,0 3px 10px rgba(0,0,0,.7);white-space:nowrap}
.pin i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #FF7A00;margin-top:-1px}
.pin.f-est .pt{box-shadow:0 0 0 2px #FF3B2F,0 0 14px 3px rgba(255,59,47,.75)}
.pin.f-ale .pt{background:#FFB020;box-shadow:0 0 0 1.5px #FFB020,0 3px 10px rgba(0,0,0,.7)}.pin.f-ale i{border-top-color:#FFB020}
.pin.f-pra .pt{background:#FFD9B0;box-shadow:0 0 0 1.5px #FFD9B0,0 3px 10px rgba(0,0,0,.7)}.pin.f-pra i{border-top-color:#FFD9B0}
.pin.sel{z-index:900;transform:translate(-50%,-100%) scale(1.25)}
.pin.f-est .pt{animation:pulso 1.8s ease-in-out infinite}
@keyframes pulso{0%,100%{box-shadow:0 0 0 2px #FF3B2F,0 0 8px 1px rgba(255,59,47,.5)}50%{box-shadow:0 0 0 2px #FF3B2F,0 0 18px 6px rgba(255,59,47,.85)}}
.leaflet-container{background:#050505;font-family:var(--f-body)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.62) contrast(1.15) saturate(.35)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#141414;color:#F4EEE8;border:1px solid #FF7A00}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}.leaflet-popup-content b{color:#FF7A00}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#8a8279!important}.leaflet-control-attribution a{color:#b9a58f!important}
.leaflet-bar a{background:#141414;color:#FF7A00;border-color:#2B2520}
/* ---------- indicadores executivos ---------- */
.ix{display:flex;flex-direction:column;gap:10px}
.ix-bar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}.ix-bar .chips{margin:0}
.ix-nota{margin-left:auto;font-size:12px;color:var(--ink-2)}
.ix-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ixk{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--or);border-radius:12px;padding:12px 16px 10px;display:flex;flex-direction:column;gap:2px;min-height:150px}
.ixk.k-ok{border-top-color:var(--ok)}.ixk.k-bad{border-top-color:var(--bad)}
.ixt{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}

.ixk.k-ok b{color:var(--ok)}.ixk.k-bad b{color:var(--bad)}
.ixm{font-size:12px;color:var(--ink-2);margin-top:auto}
.dl{font-size:12.5px;font-weight:600}.dl.good{color:var(--ok)}.dl.bad{color:var(--bad)}.dl.nd{color:var(--ink-2);font-weight:400}
.spk{position:absolute;right:12px;top:34px;width:34%;height:36px;opacity:.9}
.ixcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.ixcard h2{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--or);margin:0 0 2px}
.ix-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.ix-leg{font-size:12px;color:var(--ink-2)}.ix-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 5px 0 12px;vertical-align:-1px}
.ix-leg i.ln{width:20px;height:3px;border-radius:2px;background:#fff;vertical-align:3px}
.ixsvg{width:100%;height:auto;display:block;margin-top:6px}
.ixsvg .ax{fill:var(--ink-2);font-size:12px}.ixsvg .ax2{fill:#6f665d;font-size:10px}.ixsvg .vl{fill:var(--ink);font-size:12px;font-weight:700}.ixsvg .meta{fill:#FFD9B0;font-size:12px;font-weight:600}
.ix-leit ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}.ix-leit b{color:var(--ink)}.ix-leit b.g{color:var(--ok)}.ix-leit b.r{color:var(--bad)}
.ix-ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px}
.opsla{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--or);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.opsla.g{color:var(--ok)}.opsla.r{color:var(--bad)}
.ixsvg.sm .ax{font-size:15px}.ixsvg.sm .ax2{font-size:12px}.ixsvg.sm .vl{font-size:15px}.ixsvg.sm .meta{font-size:14px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.rn{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--ink-2);text-align:center}
.rt{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}.rt b{font-weight:600;overflow-wrap:anywhere}.rt em{font-style:normal;font-size:12px;color:var(--ink-2)}
.rbar{height:8px;border-radius:5px;background:var(--surface-2);margin-top:4px;overflow:hidden}.rbar i{display:block;height:100%;background:linear-gradient(90deg,#FF7A00,#FF5A3C);border-radius:5px}
.rc{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}.rc u{text-decoration:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.c-e{background:var(--bad-bg);color:var(--bad)}.c-s{background:var(--warn-bg);color:var(--warn)}.c-n{background:var(--info-bg);color:var(--info)}
/* ---------- lancamentos em tela cheia ---------- */
.lc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px;align-items:start}
.lc-col{display:flex;flex-direction:column;gap:12px;min-width:0}
body.cc .card{border-radius:12px;border-color:var(--line)}

body.cc .btn.ghost{background:#141414;color:var(--ink);border-color:var(--line)}

body.cc input,body.cc .sel,body.cc textarea{background:#0B0B0B;color:var(--ink);border-color:var(--line)}
textarea{font:inherit;font-size:15px;width:100%;min-width:0;border-radius:8px;border:1px solid var(--line);padding:9px 11px;text-transform:none;letter-spacing:0;font-weight:400;resize:vertical;background:var(--bg);color:var(--ink)}
textarea.mono,.hint .mono{font-family:var(--f-mono)}

body.cc .list .row{border-top-color:var(--line)}
@media (max-width:900px){.lc-cols{grid-template-columns:1fr}}

.modal-box.rel{border-color:var(--or)}.modal-box.rel h2{color:var(--or)}
@media (max-width:900px){.ix-rk{grid-template-columns:1fr}.ixk b{font-size:48px}.ix-nota{margin-left:0}}
@media (max-width:900px){.cc-main{grid-template-columns:1fr;height:auto}.cc-map{height:58vh;flex:none}.cc-list{max-height:none}.cc-kpis{grid-template-columns:repeat(2,1fr)}}
footer{font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.hdr-t h1{font-size:28px}.row{grid-template-columns:1fr auto}.row .w{grid-column:1 / -1;order:3}}

<body>
<div class="wrap" id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';

/* Painel de AUTOMACAO: nao le nenhum dado de planos do GM7. So envia pedidos (vincular / iniciar rota)
   e mostra o andamento deles. */
var WORKER_URL='https://mandalog-painel.carlos-eduardo-c87.workers.dev';
var RESULT_URL='acoes.enc.json';
var PEND_URL='pendencias.enc.json';
var HIST_URL='historico.enc.json';
var LS_ABA='mandalog-aba-v2';
var LOGO='https://mandalogcel-wq.github.io/mandalog-torre/assets/mandalog.png';
var LS_PASS='mandalog-painel-senha-v1', LS_PROG='mandalog-programacao-v1', LS_TRAT='mandalog-conflitos-tratados-v1';
var STATUS={OK:['ok','Vinculado'],SIMULADO:['sim','Simulação'],IGNORADO:['ign','Não alterado'],PENDENTE:['pend','Aguardando liberação'],ERRO:['err','Erro'],ENVIADO:['env','Enviado ao robô'],CONFLITO:['err','Conflito: aguarda sua decisão']};

var PERFIS=['FIORINO','HR','VUC','3/4','TOCO','TRUCK','CARRETA','TRUCK LONG'];
var NOMES_TIPO={vincular:'Vincular',iniciar:'Iniciar rota',roteirizar:'Roteirização',impactar:'Rota impactada',reentrega:'Reentrega'};
var ABA_NOME={SUMARE:'Café Sumaré',GRU:'Café GRU',SJC:'Café SJC'};
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var S={view:'gate',err:'',pass:'',acoes:[],enviados:[],msg:'',msgOk:false,msg2:'',msg2Ok:false,msg3:'',msg3Ok:false,edata:isoMais(hojeISO(),1),rdata:hojeISO(),rperfil:'',busy:false,prog:progGet(),poll:null};
var root=document.getElementById('root');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function progGet(){try{var v=JSON.parse(lsGet(LS_PROG)||'{}');return {quem:v.quem||'',senha:v.senha||''};}catch(e){return {quem:'',senha:''};}}
function progSet(){lsSet(LS_PROG,JSON.stringify(S.prog));}
/* conflitos ja decididos (sobrescrever / manter) neste navegador: o alerta nao volta a aparecer */
function tratGet(){try{return JSON.parse(lsGet(LS_TRAT)||'[]');}catch(e){return [];}}
function tratAdd(id){var t=tratGet();if(t.indexOf(id)<0)t.push(id);lsSet(LS_TRAT,JSON.stringify(t.slice(-60)));}
function recente(q){var t=Date.parse(String(q||'').replace(' ','T'));return !isNaN(t)&&(Date.now()-t)<2*60*60*1000;}
/* primeiro conflito recente e ainda nao decidido */
function acharConflito(){var t=tratGet();for(var i=S.acoes.length-1;i>=0;i--){var a=S.acoes[i];
  if(a.status==='CONFLITO'&&a.conflito&&t.indexOf(a.id)<0&&recente(a.quando)){return a;}}return null;}
function modalConflito(){
  var a=S.conflito;if(!a||!a.conflito)return '';var c=a.conflito;
  return '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="cfT"><div class="modal-box">'+
    '<h2 id="cfT">⚠ Atenção: o plano já tem vínculo</h2>'+
    '<p><b>Plano '+esc(c.plano)+'</b> está atrelado ao motorista <b>'+esc(c.motorista_atual)+'</b> e à placa <b>'+esc(c.placa_atual)+'</b>.</p>'+
    '<div class="dado"><b>Você pediu</b>Motorista '+esc(c.motorista_pedido)+' · Placa '+esc(c.placa_pedida)+'</div>'+
    '<p><b>Deseja sobrescrever e alterar?</b></p><p class="hint" style="margin:6px 0 0">Se sim, a placa e o motorista atuais saem da rota e entram os pedidos. Só vale para rota que ainda não foi iniciada.</p>'+
    '<div class="acoes"><button class="btn" id="cfNao" data-act="manter">Não, manter como está</button>'+
    '<button class="btn perigo" id="cfSim" data-act="sobrescrever"'+(S.busy?' disabled':'')+'>Sim, sobrescrever e alterar</button></div></div></div>';
}
function novoId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(String(Date.now())+Math.random().toString(16).slice(2));}

/* ---------- criptografia (mesmo formato do robo: PBKDF2-SHA256 + AES-256-GCM) ---------- */
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function decrypt(env,pass){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(env.s),iterations:env.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.n)},key,b64(env.c));})
  .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}

/* ---------- andamento dos pedidos ---------- */
function carrega(){
  if(!S.pass)return;
  fetch(RESULT_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.status===200?r.json():null;}).then(function(env){
    if(!env){S.acoes=[];render();return;}
    return decrypt(env,S.pass).then(function(d){S.acoes=(d&&d.resultados)||[];S.conflito=acharConflito();render();},function(){
      lsSet(LS_PASS,'');S.pass='';S.view='gate';S.err='Senha incorreta.';render();});
  }).catch(function(){});
}
/* rotas MANDALOG ainda nao finalizadas no GM7 (KPI de SLA: finalizar em ate 30 h) */
function carregaPend(){
  if(!S.pass)return;
  fetch(PEND_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.status===200?r.json():null;}).then(function(env){
    if(!env){S.pend=null;render();return;}
    return decrypt(env,S.pass).then(function(d){S.pend=d;render();},function(){});
  }).catch(function(){});
}
var OPS=[['TODAS','Todas'],['SUMARE','Café Sumaré'],['GRU','Café GRU'],['SJC','Café SJC'],['SEM','Sem operação']];
var NOP={SUMARE:'Sumaré',GRU:'GRU',SJC:'SJC',SEM:'Sem operação'};
/* cada rota e de UMA operacao: GRU_SJC (registro antigo) conta como GRU */
function opDe(x){var o=(x&&x.operacao)||'SEM';return o==='GRU_SJC'?'GRU':o;}
var SITS=[['TODAS','Todas as situações'],['finalizar','Falta finalizar'],['nao_iniciada','Não iniciadas'],['sem_movimento','Sem movimento']];
/* metas (SLA do cliente: finalizar no mesmo dia da saída = 24 h). Ajuste aqui se a meta mudar. */
var METAS={sla:95,tempo:18,semMov:2,naoIni:0,estouradas:0};
function contaPend(lista){var c={total:lista.length,estouradas:0,alerta:0,prazo:0,semMov:0,naoIni:0};lista.forEach(function(i){
  if(i.faixa==='estourada')c.estouradas++;else if(i.faixa==='alerta')c.alerta++;else c.prazo++;
  if(i.sem_movimento)c.semMov++;if(i.tipo==='nao_iniciada')c.naoIni++;});return c;}
function bateSit(i,s){return s==='TODAS'||(s==='sem_movimento'?i.sem_movimento===true:(i.tipo||'finalizar')===s);}
function bannerSLA(){
  var p=S.pend;if(!p||!p.itens)return '';var R=contaPend(p.itens),lim=Math.round(p.limite_h||24);
  if(!R.estouradas&&!R.semMov&&!R.naoIni)return '';
  var partes=[];if(R.estouradas)partes.push(R.estouradas+' estourada'+(R.estouradas>1?'s':'')+' (mais de '+lim+' h)');
  if(R.semMov)partes.push(R.semMov+' sem movimento após a saída');if(R.naoIni)partes.push(R.naoIni+' atrelada'+(R.naoIni>1?'s':'')+' e não iniciada'+(R.naoIni>1?'s':''));
  return '<div class="sla-banner'+(R.estouradas?'':' amb')+'" role="alert">⚠ '+partes.join(' · ')+'<small>Rotas MANDALOG. Aja no GM7Driver. Cobrança por e-mail às 08h e 16h, com cópia ao gestor quando há estourada.</small></div>';
}
function abas(){var a=[['lanc','Lançamentos'],['pend','Pendências'],['ind','Indicadores']];
  return '<div class="tabs" role="tablist">'+a.map(function(x){return '<button type="button" class="tab'+(S.aba===x[0]?' on':'')+'" data-act="aba" data-aba="'+x[0]+'" role="tab" aria-selected="'+(S.aba===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';}
/* ---------- central de pendencias (mapa preto/laranja) ---------- */
var MAP=null,MAPEL=null,CAMADA=null,MARC={};
var FCLS={estourada:'f-est',alerta:'f-ale',prazo:'f-pra'},FROT={estourada:'Estourada',alerta:'Em alerta',prazo:'No prazo'};
var TIP={finalizar:'Falta finalizar',nao_iniciada:'Atrelada e não iniciada'};
function itensFiltrados(){var p=S.pend;if(!p||!p.itens)return [];var op=S.opf||'TODAS',sit=S.sit||'TODAS';
  return p.itens.filter(function(i){return (op==='TODAS'||opDe(i)===op)&&bateSit(i,sit);});}
function fmtSaida(i){var s=String(i.saida||i.ref||'');return s.slice(8,10)+'/'+s.slice(5,7)+' '+s.slice(11,16);}
function fonteTxt(pos){if(!pos)return 'sem posição';
  return pos.fonte==='parada'?('última parada com chegada'+(pos.local?' ('+pos.local+')':'')):(pos.fonte==='origem'?'saída do CD':'CD (posição aproximada)');}
function pendencias(){
  var p=S.pend;
  if(!p||!p.resumo)return '<section class="card"><h2>Pendentes</h2><p class="hint">Rotas MANDALOG que exigem ação no GM7. Aguardando a primeira leitura…</p></section>';
  var lim=Math.round(p.limite_h||24),todos=p.itens||[],op=S.opf||'TODAS',sit=S.sit||'TODAS';
  var itens=itensFiltrados(),r=contaPend(itens),g=String(p.gerado||'');
  var chipsOp=OPS.map(function(o){var base=todos.filter(function(i){return o[0]==='TODAS'||opDe(i)===o[0];}),c=contaPend(base);
      if(o[0]==='SEM'&&!c.total)return '';
      return '<button type="button" class="chip sm'+(op===o[0]?' on':'')+(c.estouradas?' red':'')+'" data-act="fop" data-op="'+o[0]+'" role="tab" aria-selected="'+(op===o[0])+'">'+o[1]+' <b>'+c.total+'</b></button>';}).join('');
  var chipsSit=SITS.map(function(s){var base=todos.filter(function(i){return (op==='TODAS'||opDe(i)===op)&&bateSit(i,s[0]);});
      return '<button type="button" class="chip sm'+(sit===s[0]?' on':'')+'" data-act="fsit" data-sit="'+s[0]+'" role="tab" aria-selected="'+(sit===s[0])+'">'+s[1]+' <b>'+base.length+'</b></button>';}).join('');
  var cards=itens.map(function(i){
    var tags=(i.sem_movimento?'<span class="tag">Sem movimento</span> ':'')+(i.divergente?'<span class="tag" title="A planilha e o CD do GM7 apontam operações diferentes">Operação divergente</span> ':'')+(i.inferida?'<span class="tag" title="A planilha não tem este plano; assumido GRU (CD Guarulhos). Confirme na planilha">Operação assumida: GRU</span>':'');
    return '<div class="vc '+FCLS[i.faixa]+(S.sel===i.plano?' sel':'')+'" data-act="sel" data-plano="'+esc(i.plano)+'" tabindex="0">'+
      '<span class="pt">'+esc(i.placa||'SEM PLACA')+'</span><span class="h">'+Math.round(i.horas)+' h</span>'+
      '<span class="w"><b>'+esc(i.motorista||'—')+'</b> · plano '+esc(i.plano)+'<br><span class="opx">'+esc(NOP[opDe(i)]||'')+' · '+esc(TIP[i.tipo]||'')+' · '+FROT[i.faixa]+'</span> '+tags+
      '<br><span class="opx">'+(i.tipo==='nao_iniciada'?'saída prevista ':'saiu ')+esc(fmtSaida(i))+' · '+esc(fonteTxt(i.pos))+'</span></span></div>';}).join('');
  return '<div class="cc-main"><section class="cc-left">'+
    '<div class="cc-bar"><div class="chips" role="tablist" aria-label="Operação">'+chipsOp+'</div><div class="chips" role="tablist" aria-label="Situação">'+chipsSit+'</div>'+
      '<button type="button" class="btn rel-btn" data-act="relabre" title="Gerar relatório em PDF ou Excel">⬇ Relatório</button></div>'+
    '<div class="cc-kpis"><div class="cc-kpi k1"><b>'+r.estouradas+'</b><span>Estouradas (&gt; '+lim+' h)</span></div><div class="cc-kpi k2"><b>'+r.alerta+'</b><span>Em alerta</span></div>'+
    '<div class="cc-kpi k3"><b>'+r.prazo+'</b><span>No prazo</span></div><div class="cc-kpi k4"><b>'+r.semMov+'</b><span>Sem movimento</span></div></div>'+
    '<div class="cc-map"><div id="mapaSlot" style="position:absolute;inset:0"></div>'+
    '<div class="cc-leg"><span><i style="background:#FF3B2F"></i>Estourada</span><span><i style="background:#FFB020"></i>Em alerta</span><span><i style="background:#FF7A00"></i>Em andamento</span><span><i style="background:#FFD9B0"></i>No prazo</span></div></div></section>'+
    '<aside class="cc-side"><div class="cc-sh">Veículos pendentes · '+itens.length+'<small>Rotas MANDALOG dos últimos '+(p.janela_dias||7)+' dias · meta '+lim+' h · atualizado '+esc(g.slice(8,10)+'/'+g.slice(5,7)+' '+g.slice(11,16))+'</small></div>'+
    '<div class="cc-list">'+(cards||'<div class="empty" style="margin:12px">'+(todos.length?'Nenhuma rota neste filtro.':'✔ Nenhuma rota MANDALOG pendente de ação.')+'</div>')+'</div></aside></div>';
}
/* o mapa e criado uma vez e reaproveitado a cada render (o render recria o HTML da tela) */
function pinHtml(i,sel){return '<div class="pin '+FCLS[i.faixa]+(sel?' sel':'')+'"><span class="pt">'+esc(i.placa||'S/PLACA')+'</span><i></i></div>';}
function posicoes(itens){var uso={},out={};
  itens.forEach(function(i){if(!i.pos||typeof i.pos.lat!=='number'||typeof i.pos.lng!=='number')return;
    var k=i.pos.lat.toFixed(4)+','+i.pos.lng.toFixed(4),n=uso[k]||0;uso[k]=n+1;
    if(n===0){out[i.plano]=[i.pos.lat,i.pos.lng];return;}
    var ang=n*2.399963,rad=0.0016*Math.sqrt(n);   // espalha pontos no mesmo local (ex.: ainda no CD) em espiral
    out[i.plano]=[i.pos.lat+rad*Math.sin(ang),i.pos.lng+rad*Math.cos(ang)];});
  return out;}
function atualizaMapa(){
  var slot=document.getElementById('mapaSlot');if(!slot)return;
  if(typeof L==='undefined'){slot.innerHTML='<div class="empty" style="margin:14px">Mapa indisponível: não consegui carregar a biblioteca de mapas. A lista ao lado continua valendo.</div>';return;}
  if(!MAPEL){MAPEL=document.createElement('div');MAPEL.id='mapa';}
  slot.appendChild(MAPEL);
  if(!MAP){MAP=L.map(MAPEL,{zoomControl:true,preferCanvas:false}).setView([-23.0,-46.9],8);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(MAP);   // escurecido por CSS (filtro no tile-pane)
    CAMADA=L.layerGroup().addTo(MAP);}
  MAP.invalidateSize();CAMADA.clearLayers();MARC={};
  var its=itensFiltrados(),pos=posicoes(its),pts=[];
  its.forEach(function(i){var c=pos[i.plano];if(!c)return;pts.push(c);
    var m=L.marker(c,{icon:L.divIcon({className:'pinw',html:pinHtml(i,S.sel===i.plano),iconSize:[0,0]}),riseOnHover:true}).addTo(CAMADA);

function enviar(tipo,d,limpar){
  var K=tipo==='reentrega'?'msg3':((tipo==='roteirizar'||tipo==='impactar')?'msg2':'msg');
  function dize(t,ok){S[K]=t;S[K+'Ok']=ok;if(K==='msg2')S.msgOk=S.msgOk;}
  if(!S.prog.quem||!S.prog.senha){dize('Informe seu nome e a senha de programação.',false);render();return;}
  var id=novoId(),body=Object.assign({tipo:tipo,id:id,senha:S.prog.senha,quem:S.prog.quem},d);
  S.msg='';S.msg2='';S.msg3='';
  S.busy=true;dize('Enviando…',false);render();
  fetch(WORKER_URL.replace(/\/$/,'')+'/acao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      S.busy=false;
      if(x.j&&x.j.ok){S.enviados.unshift({id:id,tipo:tipo,plano:d.plano});dize('Pedido enviado. O resultado aparece em "Andamento" em instantes.',true);S.limpar=limpar;
        [15000,35000,70000].forEach(function(t){setTimeout(carrega,t);});}
      else{dize('Não enviado: '+((x.j&&x.j.erro)||('HTTP '+x.s)),false);}
      render();})
    .catch(function(){S.busy=false;dize('Não consegui falar com o endpoint.',false);render();});
}

  if(!lista.length)return h+'<div class="empty">Nenhum lançamento ainda.</div></section>';
  return h+'<div class="list">'+lista.map(function(a){
    var st=STATUS[a.status]||['pend',a.status||'–'];
    return '<div class="row"><span class="pl">'+esc(a.plano)+'</span><span class="w"><b>'+esc(NOMES_TIPO[a.tipo]||a.tipo)+'</b> · '+esc(a.motivo||'')+(a.quem?' · '+esc(a.quem):'')+(a.quando?' · '+esc(String(a.quando).slice(8,10)+'/'+String(a.quando).slice(5,7)+' '+String(a.quando).slice(11,16)):'')+'</span><span class="badge '+st[0]+'">'+esc(st[1])+'</span></div>';}).join('')+'</div></section>';
}
/* ---------- reentregas: NFs nao entregues, lancadas pelo cliente como reentrega para outro dia ---------- */
function reentregas(off){
  return '<section class="card"><h2>Reentregas</h2><p class="hint">Notas que não foram entregues e que o cliente lançou como reentrega. Cole <b>uma NF por linha, com a senha ao lado</b> (<span class="mono">NF;senha</span>). O robô copia cliente e cidade da primeira entrega, na própria aba, e cria uma linha nova com STATUS = REENTREGA e a senha (Sumaré: coluna COMPLEMENTO; GRU e SJC: coluna SENHAS).</p>'+
    '<form id="reentForm"><div class="grid">'+
    '<label>Nº do plano<input id="ePlano" class="mono" inputmode="numeric" placeholder="plano novo, ex.: 6103333346" maxlength="40" required></label>'+
    '<label>Data de saída<input id="eData" type="date" value="'+esc(S.edata)+'" required></label>'+
    '<label>Motorista<input id="eMot" placeholder="nome e sobrenome" maxlength="80" required></label>'+
    '<label>Placa<input id="ePlaca" class="mono" placeholder="ABC1D23" maxlength="8" required></label>'+
    '<label>Perfil do veículo<select id="ePerfil" class="sel" required><option value="">Escolha…</option>'+PERFIS.map(function(x){return '<option'+(S.eperfil===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label></div>'+
    '<label style="margin-top:12px">NFs e senhas (uma por linha)<textarea id="eNfs" class="mono" rows="7" spellcheck="false" placeholder="436452;04526982&#10;436453;04526983&#10;436460;04527001" required></textarea></label>'+
    '<div class="ops"><button class="btn" type="submit" data-aba="SUMARE"'+off+'>Café Sumaré</button><button class="btn" type="submit" data-aba="GRU"'+off+'>Café GRU</button><button class="btn" type="submit" data-aba="SJC"'+off+'>Café SJC</button></div></form>'+
    (S.msg3?'<p class="msg'+(S.msg3Ok?' ok':(S.busy?'':' bad'))+'" role="status">'+esc(S.msg3)+'</p>':'')+'</section>';
}
/* "436452;04526982" ou "436452 04526982" ou so "436452"  ->  [{nf, senha}] */
function leNfs(txt){
  var itens=[],erros=[],vistos={};
  String(txt||'').split(/\r?\n/).forEach(function(l,i){
    l=l.trim();if(!l)return;
    var m=l.match(/^([^;\t, ]+)\s*[;\t, ]?\s*(.*)$/);
    var nf=String(m?m[1]:'').split('-')[0].replace(/^0+/,'');
    if(!/^\d{1,12}$/.test(nf)){erros.push('linha '+(i+1)+': NF inválida ('+l.slice(0,20)+')');return;}
    if(vistos[nf]){erros.push('linha '+(i+1)+': NF '+nf+' repetida');return;}
    vistos[nf]=1;itens.push({nf:nf,senha:(m[2]||'').trim().slice(0,40)});});
  return {itens:itens,erros:erros};
}
function render(){
  var foco=document.activeElement&&document.activeElement.id,keep={};
  ['pPlano','pMot','pPlaca','sPlano','rPlano','rData','rPerfil','iPlano','pQuem','pSenha','pw','ePlano','eData','eMot','ePlaca','ePerfil','eNfs'].forEach(function(id){var e=document.getElementById(id);if(e)keep[id]=e.value;});
  if(keep.eData)S.edata=keep.eData;if(keep.ePerfil!==undefined)S.eperfil=keep.ePerfil;
  if(keep.rData)S.rdata=keep.rData;if(keep.rPerfil!==undefined)S.rperfil=keep.rPerfil;
  if(S.view==='gate'){
    document.body.classList.add('cc');
    root.innerHTML=header()+'<section class="card gate"><h2>Entrar</h2><p class="hint">Digite a senha do painel para ver o andamento dos pedidos.</p>'+
      '<form id="gateForm"><label>Senha<input id="pw" type="password" autocomplete="current-password" autofocus></label>'+
      (S.err?'<p class="msg bad" role="alert">'+esc(S.err)+'</p>':'')+
      '<p style="margin-top:12px"><button class="btn" type="submit">Entrar</button></p></form></section>';
    return;
  }
  var off=S.busy?' disabled':'';
  var lanc='<div class="lc-cols"><div class="lc-col">'+
    '<section class="card"><h2>Identificação</h2><p class="hint">Quem está lançando. Fica salvo neste navegador.</p><div class="grid">'+
      '<label>Seu nome<input id="pQuem" maxlength="40" autocomplete="off" value="'+esc(S.prog.quem)+'"></label>'+
      '<label>Senha de programação<input id="pSenha" type="password" autocomplete="off" value="'+esc(S.prog.senha)+'"></label></div></section>'+
    '<section class="card"><h2>Lançar plano</h2><p class="hint">Informe o número do plano (código da rota no GM7, 10 dígitos), a placa e o motorista (nome e sobrenome). O robô acha a placa no GM7, confere o motorista (sem exigir o nome idêntico) e vincula na rota. Se a rota já tiver motorista ou placa reais diferentes, aparece um alerta na tela perguntando se você quer sobrescrever.</p>'+
      '<form id="lancarForm"><div class="grid">'+
      '<label>Nº do plano<input id="pPlano" class="mono" inputmode="numeric" placeholder="ex.: 6103333346" maxlength="40" required></label>'+
      '<label>Motorista<input id="pMot" placeholder="nome e sobrenome" maxlength="80" required></label>'+
      '<label>Placa<input id="pPlaca" class="mono" placeholder="ABC1D23" maxlength="8" required></label>'+
      '<div><button class="btn" type="submit"'+off+'>Lançar e vincular</button></div></div></form>'+
      '<div class="sep"></div>'+
      '<h2 style="font-size:20px">Iniciar rota</h2><p class="hint">Dá o início da rota no GM7Driver. Só funciona se a rota já tiver motorista e placa.</p>'+
      '<form id="iniciarForm"><div class="grid">'+
      '<label>Nº do plano<input id="sPlano" class="mono" inputmode="numeric" placeholder="ex.: 6103333346" maxlength="40" required></label>'+
      '<div><button class="btn ghost" type="submit"'+off+'>▶ Iniciar rota</button></div></div></form>'+
      (S.msg?'<p class="msg'+(S.msgOk?' ok':(S.busy?'':' bad'))+'" role="status">'+esc(S.msg)+'</p>':'')+'</section>'+
    '</div><div class="lc-col">'+
    '<section class="card"><h2>Roteirização</h2><p class="hint">Traz do GM7 os clientes, notas e cidades do plano e inclui na planilha de roteirização, na aba da operação que você escolher. O motorista e a placa vêm do GM7. Plano e nota que já estão na aba não são repetidos.</p>'+
      '<form id="roteForm"><div class="grid">'+
      '<label>Nº do plano<input id="rPlano" class="mono" inputmode="numeric" placeholder="ex.: 6103333346" maxlength="40" required></label>'+
      '<label>Data do lançamento<input id="rData" type="date" value="'+esc(S.rdata)+'" required></label>'+
      '<label>Perfil do veículo<select id="rPerfil" class="sel" required><option value="">Escolha…</option>'+PERFIS.map(function(x){return '<option'+(S.rperfil===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label></div>'+
      '<div class="ops"><button class="btn" type="submit" data-aba="SUMARE"'+off+'>Café Sumaré</button><button class="btn" type="submit" data-aba="GRU"'+off+'>Café GRU</button><button class="btn" type="submit" data-aba="SJC"'+off+'>Café SJC</button></div></form>'+
      '<div class="sep"></div>'+
      '<h2 style="font-size:20px">Rota impactada</h2><p class="hint">O cliente cancelou o plano? Muda a coluna de emissão das linhas desse plano para NÃO EMITIR, em todas as abas. Não apaga nada.</p>'+
      '<form id="impForm"><div class="grid"><label>Nº do plano<input id="iPlano" class="mono" inputmode="numeric" placeholder="ex.: 6103333346" maxlength="40" required></label>'+
      '<div><button class="btn ghost" type="submit"'+off+'>Marcar NÃO EMITIR</button></div></div></form>'+
      (S.msg2?'<p class="msg'+(S.msg2Ok?' ok':(S.busy?'':' bad'))+'" role="status">'+esc(S.msg2)+'</p>':'')+'</section>'+
    reentregas(off)+
    '</div><div class="lc-col">'+andamento()+'</div></div>';
  var corpo=S.aba==='ind'?indicadores():(S.aba==='pend'?pendencias():lanc);
  document.body.classList.add('cc');
  if(S.anim){root.classList.add('anim');S.anim=false;}else root.classList.remove('anim');
  root.innerHTML=header(vivo()+'<button class="hbtn" data-act="sair">Sair</button>')+bannerSLA()+abas()+corpo+
    '<footer>Os dados dos planos ficam no GM7. Este painel só envia os pedidos e mostra o resultado.</footer>'+modalConflito()+modalRel();
  if(S.aba==='pend')atualizaMapa();
  Object.keys(keep).forEach(function(id){var e=document.getElementById(id);if(e&&keep[id]!=='')e.value=keep[id];});
  if(S.limpar){['pPlano','pMot','pPlaca','sPlano','rPlano','iPlano','ePlano','eMot','ePlaca','eNfs'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});S.limpar=false;}
  if(foco){var f=document.getElementById(foco);if(f&&f.focus)f.focus();}
}

/* ---------- eventos ---------- */
function guarda(){var q=document.getElementById('pQuem'),s=document.getElementById('pSenha');if(q)S.prog.quem=q.value.trim();if(s)S.prog.senha=s.value;progSet();}
root.addEventListener('click',function(ev){var b=ev.target.closest('[data-act]');if(!b)return;var ac=b.getAttribute('data-act');
  if(ac==='sair'){lsSet(LS_PASS,'');S.pass='';S.acoes=[];S.conflito=null;S.view='gate';S.err='';render();return;}
  if(ac==='relabre'){S.rel=relNovo();render();return;}
  if(ac==='relfecha'){S.rel=null;render();return;}
  if(ac==='relop'&&S.rel){relLeCampos();S.rel.op=b.getAttribute('data-op')||'TODAS';S.rel.msg='';render();return;}
  if(ac==='relmodo'&&S.rel){relLeCampos();S.rel.modo=b.getAttribute('data-m')==='periodo'?'periodo':'dia';S.rel.msg='';render();return;}
  if(ac==='relpreset'&&S.rel){var pp=b.getAttribute('data-p'),hj0=hojeISO();
    if(pp==='semana'||pp==='semanaant'){var sw=semanaSeg(pp==='semana');S.rel.de=sw[0];S.rel.ate=sw[1];}else{S.rel.ate=hj0;S.rel.de=isoMais(hj0,-(parseInt(pp,10)-1));}
    S.rel.msg='';render();return;}
  if(ac==='relpdf'){relGerar('pdf');return;}
  if(ac==='relxls'){relGerar('xls');return;}
  if(ac==='sel'){seleciona(b.getAttribute('data-plano'),true);return;}
  if(ac==='fop'){S.opf=b.getAttribute('data-op')||'TODAS';render();return;}
  if(ac==='fsit'){S.sit=b.getAttribute('data-sit')||'TODAS';render();return;}
  if(ac==='per'){S.per=parseInt(b.getAttribute('data-per'),10)||7;render();return;}
  if(ac==='iop'){S.iop=b.getAttribute('data-op')||'TODAS';render();return;}
  if(ac==='aba'){S.anim=true;S.aba=b.getAttribute('data-aba')||'lanc';lsSet(LS_ABA,S.aba);render();window.scrollTo(0,0);return;}
  if(ac==='manter'&&S.conflito){tratAdd(S.conflito.id);S.conflito=null;S.msg='Mantido como estava. Nada foi alterado.';S.msgOk=true;render();return;}
  if(ac==='sobrescrever'&&S.conflito&&S.conflito.conflito){var c=S.conflito.conflito;
    if(!S.prog.quem||!S.prog.senha){S.conflito=null;S.msg='Informe seu nome e a senha de programação e envie de novo.';S.msgOk=false;render();return;}
    tratAdd(S.conflito.id);S.conflito=null;
    enviar('vincular',{plano:c.plano,motorista:c.motorista_pedido,placa:c.placa_pedida,sobrescrever:true},false);}});
root.addEventListener('change',function(ev){if(S.rel&&/^rel(Data|De|Ate)$/.test(ev.target.id||'')){relLeCampos();S.rel.msg='';}});
root.addEventListener('submit',function(ev){
  ev.preventDefault();var id=ev.target.id;
  if(id==='gateForm'){var v=document.getElementById('pw').value;if(!v)return;S.pass=v;S.err='';lsSet(LS_PASS,v);S.view='ok';render();carrega();carregaPend();carregaHist();agenda();return;}
  guarda();
  if(id==='lancarForm'){
    var plano=document.getElementById('pPlano').value.trim(),mot=document.getElementById('pMot').value.trim(),placa=document.getElementById('pPlaca').value.trim().toUpperCase();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(plano)){S.msg='Número do plano inválido.';S.msgOk=false;render();return;}
    if(mot.length<3){S.msg='Informe o motorista.';S.msgOk=false;render();return;}
    if(!/^[A-Z]{3}-?[0-9][A-Z0-9][0-9]{2}$/.test(placa)){S.msg='Placa inválida (ex.: ABC1D23).';S.msgOk=false;render();return;}
    enviar('vincular',{plano:plano,motorista:mot,placa:placa},true);return;}
  if(id==='roteForm'){
    var aba=ev.submitter&&ev.submitter.getAttribute('data-aba');
    var p3=document.getElementById('rPlano').value.trim(),dt=document.getElementById('rData').value,pf=document.getElementById('rPerfil').value;
    if(!aba){S.msg2='Escolha a operação pelos botões Café Sumaré, Café GRU ou Café SJC.';S.msg2Ok=false;render();return;}
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(p3)){S.msg2='Número do plano inválido.';S.msg2Ok=false;render();return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){S.msg2='Escolha a data do lançamento.';S.msg2Ok=false;render();return;}
    if(PERFIS.indexOf(pf)<0){S.msg2='Escolha o perfil do veículo.';S.msg2Ok=false;render();return;}
    S.rdata=dt;S.rperfil=pf;
    if(!confirm('Incluir o plano '+p3+' na aba '+ABA_NOME[aba]+' da planilha, com data '+dt.split('-').reverse().join('/')+' e perfil '+pf+'?'))return;
    enviar('roteirizar',{plano:p3,aba:aba,data:dt,perfil:pf},true);return;}
  if(id==='reentForm'){
    var aba5=ev.submitter&&ev.submitter.getAttribute('data-aba');
    var pl5=document.getElementById('ePlano').value.trim(),dt5=document.getElementById('eData').value,mo5=document.getElementById('eMot').value.trim(),pc5=document.getElementById('ePlaca').value.trim().toUpperCase();
    var pf5=document.getElementById('ePerfil').value;
    var nfs=leNfs(document.getElementById('eNfs').value);
    function e3(m){S.msg3=m;S.msg3Ok=false;render();}
    if(!aba5)return e3('Escolha a operação pelos botões Café Sumaré, Café GRU ou Café SJC.');
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(pl5))return e3('Número do plano inválido.');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt5))return e3('Escolha a data de saída.');
    if(mo5.length<3)return e3('Informe o motorista.');
    if(!/^[A-Z]{3}-?[0-9][A-Z0-9][0-9]{2}$/.test(pc5))return e3('Placa inválida (ex.: ABC1D23).');
    if(PERFIS.indexOf(pf5)<0)return e3('Escolha o perfil do veículo.');
    S.eperfil=pf5;
    if(nfs.erros.length)return e3('Corrija as NFs: '+nfs.erros.slice(0,3).join('; ')+(nfs.erros.length>3?' …':''));
    if(!nfs.itens.length)return e3('Informe ao menos uma NF.');
    if(nfs.itens.length>100)return e3('No máximo 100 NFs por pedido.');
    S.edata=dt5;
    if(!confirm('Lançar '+nfs.itens.length+' NF(s) como REENTREGA na aba '+ABA_NOME[aba5]+'?\nPlano '+pl5+' · saída '+dt5.split('-').reverse().join('/')+'\nMotorista '+mo5+' · placa '+pc5+' · perfil '+pf5+'\n\nO robô cria uma linha nova para cada NF, com os dados da primeira entrega.'))return;
    enviar('reentrega',{plano:pl5,aba:aba5,data:dt5,motorista:mo5,placa:pc5,perfil:pf5,itens:nfs.itens},true);return;}
  if(id==='impForm'){
    var p4=document.getElementById('iPlano').value.trim();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(p4)){S.msg2='Número do plano inválido.';S.msg2Ok=false;render();return;}
    if(!confirm('Marcar NÃO EMITIR em todas as linhas do plano '+p4+' na planilha?\nNada é apagado, só a coluna de emissão muda.'))return;
    enviar('impactar',{plano:p4},true);return;}
  if(id==='iniciarForm'){
    var p2=document.getElementById('sPlano').value.trim();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(p2)){S.msg='Número do plano inválido.';S.msgOk=false;render();return;}
    if(!confirm('Iniciar a rota do plano '+p2+'?\nIsso registra o início da rota no GM7 e não pode ser desfeito por aqui.'))return;
    enviar('iniciar',{plano:p2},true);}
});

S.pass=lsGet(LS_PASS);S.aba=lsGet(LS_ABA)||'lanc';
if(S.pass){S.view='ok';render();carrega();carregaPend();carregaHist();agenda();}else render();
})();
</script>
