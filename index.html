<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Carregamentos Mandalog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#12182B; --ink-2:#4B536B; --line:#D8DCE6;
  --navy:#143A6B; --or:#EE7D22; --or-ink:#FFFFFF; --focus:#2C40C4;
  --ok:#14803F; --ok-bg:#DBF2E3; --warn:#9A6200; --warn-bg:#FFEFC7; --bad:#B42525; --bad-bg:#FADADA; --info:#1B4F8F; --info-bg:#E2E7FB;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D111B; --surface:#161C2B; --surface-2:#1C2335; --ink:#E7EBF5; --ink-2:#9BA5BF; --line:#29324A;
    --navy:#14275A; --or:#F59A4B; --or-ink:#0D111B; --focus:#8493F7;
    --ok:#52C885; --ok-bg:#12301F; --warn:#F0B441; --warn-bg:#3A2B09; --bad:#F27676; --bad-bg:#3D1616; --info:#9DB7E8; --info-bg:#1E2848;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D111B; --surface:#161C2B; --surface-2:#1C2335; --ink:#E7EBF5; --ink-2:#9BA5BF; --line:#29324A;
  --navy:#14275A; --or:#F59A4B; --or-ink:#0D111B; --focus:#8493F7;
  --ok:#52C885; --ok-bg:#12301F; --warn:#F0B441; --warn-bg:#3A2B09; --bad:#F27676; --bad-bg:#3D1616; --info:#9DB7E8; --info-bg:#1E2848;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.hdr{background:var(--navy);color:#fff;border-bottom:5px solid var(--or);border-radius:12px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.logo{background:#fff;border-radius:8px;padding:4px 12px;display:flex;align-items:center;min-height:56px}
.logo img{display:block;max-height:56px;max-width:200px;width:auto;height:auto}
.hdr-t{flex:1 1 240px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#F6B27A}
.hdr-t h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.01em}
.hbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 12px;font-weight:500}
.hbtn:hover{background:rgba(255,255,255,.2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;color:var(--navy);margin-bottom:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card h2{color:var(--info)}}
:root[data-theme="dark"] .card h2{color:var(--info)}
.hint{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
input{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input.mono{font-family:var(--f-mono)}
.btn{border:1px solid var(--or);background:var(--or);color:var(--or-ink);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.msg.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sep{height:1px;background:var(--line);margin:16px 0}
.sel{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input[type=date]{color-scheme:light dark}
.ops{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pl{font-family:var(--f-mono);font-weight:500}
.w{font-size:13px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.w b{color:var(--ink);font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.sim,.badge.env{background:var(--info-bg);color:var(--info);border-color:transparent}
.badge.ign,.badge.pend{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.empty{padding:14px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.gate{max-width:420px;margin:24px auto;width:100%}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,26,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);color:var(--ink);border:2px solid var(--bad);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.modal-box h2{font-family:var(--f-display);font-size:28px;color:var(--bad);margin-bottom:8px}
.modal-box .dado{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px;overflow-wrap:anywhere}
.modal-box .dado b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.modal-box .acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn.perigo{background:var(--bad);border-color:var(--bad);color:#fff}
.sla-banner{background:var(--bad);color:#fff;border-radius:12px;padding:14px 18px;font-weight:600;font-size:17px;border:2px solid #7d1313}
.sla-banner small{display:block;font-weight:400;font-size:13px;opacity:.95;margin-top:2px}
.sla-ok{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 16px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{border-radius:10px;padding:10px 12px;text-align:center;border:1px solid var(--line);background:var(--surface-2)}
.kpi b{display:block;font-family:var(--f-display);font-size:38px;line-height:1}
.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi.k-est{background:var(--bad-bg);color:var(--bad)}.kpi.k-ale{background:var(--warn-bg);color:var(--warn)}.kpi.k-pra{background:var(--ok-bg);color:var(--ok)}
.prow{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:4px 12px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);border-left:5px solid var(--line)}
.prow.f-est{border-left-color:var(--bad);background:var(--bad-bg)}.prow.f-ale{border-left-color:var(--warn);background:var(--warn-bg)}.prow.f-pra{border-left-color:var(--ok)}
.prow .h{font-family:var(--f-display);font-size:24px;font-weight:700;white-space:nowrap}
.prow.f-est .h{color:var(--bad)}.prow.f-ale .h{color:var(--warn)}
.sla-banner.amb{background:var(--warn);color:#fff;border-color:#6b4500}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-top:2px}
.tab{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:16px;padding:10px 16px;border-bottom:4px solid transparent;margin-bottom:-2px;min-height:44px}
.tab.on{color:var(--navy);border-bottom-color:var(--or)}
:root[data-theme="dark"] .tab.on{color:var(--info)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on{color:var(--info)}}
.chip.sm{padding:5px 11px;min-height:34px;font-size:13px}
.tag{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.mcard b{font-family:var(--f-display);font-size:34px;line-height:1.05}
.mcard .mt{font-size:12px;font-weight:600;color:var(--ink-2)}.mcard .mm{font-size:12px;color:var(--ink-2)}
.mcard.m-ok{background:var(--ok-bg);color:var(--ok)}.mcard.m-bad{background:var(--bad-bg);color:var(--bad)}
.mcard.m-ok .mt,.mcard.m-ok .mm,.mcard.m-bad .mt,.mcard.m-bad .mm{color:inherit}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:12px;overflow-x:auto;padding-bottom:30px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:44px;position:relative}
.bar .bv{width:100%;background:var(--or);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bar .bv span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:700}
.bar small{position:absolute;bottom:-30px;font-size:10px;color:var(--ink-2);text-align:center;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px;display:inline-flex;gap:8px;align-items:center}
.chip b{background:var(--surface-2);border-radius:999px;padding:1px 8px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.chip.on b{background:rgba(255,255,255,.2)}
.chip.red:not(.on){border-color:var(--bad)}.chip .dot{font-size:11px;font-weight:700;color:var(--bad)}.chip.on .dot{color:#FFD0D0}
.opx{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:520px){.prow{grid-template-columns:1fr auto}.prow .w{grid-column:1 / -1;order:3}.kpi b{font-size:30px}}
footer{font-size:12px;color:var(--ink-2)}
@media (max-width:520px){.hdr-t h1{font-size:28px}.row{grid-template-columns:1fr auto}.row .w{grid-column:1 / -1;order:3}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(function(){
'use strict';

/* Painel de AUTOMACAO: nao le nenhum dado de planos do GM7. So envia pedidos (vincular / iniciar rota)
   e mostra o andamento deles. */
var WORKER_URL='https://mandalog-painel.carlos-eduardo-c87.workers.dev';
var RESULT_URL='acoes.enc.json';
var PEND_URL='pendencias.enc.json';
var HIST_URL='historico.enc.json';
var LS_ABA='mandalog-aba-v1';
var LOGO='https://mandalogcel-wq.github.io/mandalog-torre/assets/mandalog.png';
var LS_PASS='mandalog-painel-senha-v1', LS_PROG='mandalog-programacao-v1', LS_TRAT='mandalog-conflitos-tratados-v1';
var STATUS={OK:['ok','Vinculado'],SIMULADO:['sim','Simulação'],IGNORADO:['ign','Não alterado'],PENDENTE:['pend','Aguardando liberação'],ERRO:['err','Erro'],ENVIADO:['env','Enviado ao robô'],CONFLITO:['err','Conflito: aguarda sua decisão']};

var PERFIS=['FIORINO','HR','VUC','3/4','TOCO','TRUCK','CARRETA','TRUCK LONG'];
var NOMES_TIPO={vincular:'Vincular',iniciar:'Iniciar rota',roteirizar:'Roteirização',impactar:'Rota impactada'};
var ABA_NOME={SUMARE:'Café Sumaré',GRU:'Café GRU',SJC:'Café SJC'};
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var S={view:'gate',err:'',pass:'',acoes:[],enviados:[],msg:'',msgOk:false,msg2:'',msg2Ok:false,rdata:hojeISO(),rperfil:'',busy:false,prog:progGet(),poll:null};
var root=document.getElementById('root');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function progGet(){try{var v=JSON.parse(lsGet(LS_PROG)||'{}');return {quem:v.quem||'',senha:v.senha||''};}catch(e){return {quem:'',senha:''};}}
function progSet(){lsSet(LS_PROG,JSON.stringify(S.prog));}
/* conflitos ja decididos (sobrescrever / manter) neste navegador: o alerta nao volta a aparecer */
function tratGet(){try{return JSON.parse(lsGet(LS_TRAT)||'[]');}catch(e){return [];}}
function tratAdd(id){var t=tratGet();if(t.indexOf(id)<0)t.push(id);lsSet(LS_TRAT,JSON.stringify(t.slice(-60)));}
function recente(q){var t=Date.parse(String(q||'').replace(' ','T'));return !isNaN(t)&&(Date.now()-t)<2*60*60*1000;}
/* primeiro conflito recente e ainda nao decidido */
function acharConflito(){var t=tratGet();for(var i=S.acoes.length-1;i>=0;i--){var a=S.acoes[i];
  if(a.status==='CONFLITO'&&a.conflito&&t.indexOf(a.id)<0&&recente(a.quando)){return a;}}return null;}
function modalConflito(){
  var a=S.conflito;if(!a||!a.conflito)return '';var c=a.conflito;
  return '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="cfT"><div class="modal-box">'+
    '<h2 id="cfT">⚠ Atenção: o plano já tem vínculo</h2>'+
    '<p><b>Plano '+esc(c.plano)+'</b> está atrelado ao motorista <b>'+esc(c.motorista_atual)+'</b> e à placa <b>'+esc(c.placa_atual)+'</b>.</p>'+
    '<div class="dado"><b>Você pediu</b>Motorista '+esc(c.motorista_pedido)+' · Placa '+esc(c.placa_pedida)+'</div>'+
    '<p><b>Deseja sobrescrever e alterar?</b></p><p class="hint" style="margin:6px 0 0">Se sim, a placa e o motorista atuais saem da rota e entram os pedidos. Só vale para rota que ainda não foi iniciada.</p>'+
    '<div class="acoes"><button class="btn" id="cfNao" data-act="manter">Não, manter como está</button>'+
    '<button class="btn perigo" id="cfSim" data-act="sobrescrever"'+(S.busy?' disabled':'')+'>Sim, sobrescrever e alterar</button></div></div></div>';
}
function novoId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(String(Date.now())+Math.random().toString(16).slice(2));}

/* ---------- criptografia (mesmo formato do robo: PBKDF2-SHA256 + AES-256-GCM) ---------- */
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function decrypt(env,pass){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(env.s),iterations:env.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.n)},key,b64(env.c));})
  .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}

/* ---------- andamento dos pedidos ---------- */
function carrega(){
  if(!S.pass)return;
  fetch(RESULT_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.status===200?r.json():null;}).then(function(env){
    if(!env){S.acoes=[];render();return;}
    return decrypt(env,S.pass).then(function(d){S.acoes=(d&&d.resultados)||[];S.conflito=acharConflito();render();},function(){
      lsSet(LS_PASS,'');S.pass='';S.view='gate';S.err='Senha incorreta.';render();});
  }).catch(function(){});
}
/* rotas MANDALOG ainda nao finalizadas no GM7 (KPI de SLA: finalizar em ate 30 h) */
function carregaPend(){
  if(!S.pass)return;
  fetch(PEND_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.status===200?r.json():null;}).then(function(env){
    if(!env){S.pend=null;render();return;}
    return decrypt(env,S.pass).then(function(d){S.pend=d;render();},function(){});
  }).catch(function(){});
}
var OPS=[['TODAS','Todas'],['SUMARE','Café Sumaré'],['GRU','Café GRU'],['SJC','Café SJC'],['GRU_SJC','GRU / SJC (a definir)'],['SEM','Sem operação']];
var NOP={SUMARE:'Sumaré',GRU:'GRU',SJC:'SJC',GRU_SJC:'GRU / SJC (a definir)',SEM:'Sem operação'};
var SITS=[['TODAS','Todas as situações'],['finalizar','Falta finalizar'],['nao_iniciada','Não iniciadas'],['sem_movimento','Sem movimento']];
/* metas (SLA do cliente: finalizar no mesmo dia da saída = 24 h). Ajuste aqui se a meta mudar. */
var METAS={sla:95,tempo:18,semMov:2,naoIni:0,estouradas:0};
function contaPend(lista){var c={total:lista.length,estouradas:0,alerta:0,prazo:0,semMov:0,naoIni:0};lista.forEach(function(i){
  if(i.faixa==='estourada')c.estouradas++;else if(i.faixa==='alerta')c.alerta++;else c.prazo++;
  if(i.sem_movimento)c.semMov++;if(i.tipo==='nao_iniciada')c.naoIni++;});return c;}
function bateSit(i,s){return s==='TODAS'||(s==='sem_movimento'?i.sem_movimento===true:(i.tipo||'finalizar')===s);}
function bannerSLA(){
  var p=S.pend;if(!p||!p.itens)return '';var R=contaPend(p.itens),lim=Math.round(p.limite_h||24);
  if(!R.estouradas&&!R.semMov&&!R.naoIni)return '';
  var partes=[];if(R.estouradas)partes.push(R.estouradas+' estourada'+(R.estouradas>1?'s':'')+' (mais de '+lim+' h)');
  if(R.semMov)partes.push(R.semMov+' sem movimento após a saída');if(R.naoIni)partes.push(R.naoIni+' atrelada'+(R.naoIni>1?'s':'')+' e não iniciada'+(R.naoIni>1?'s':''));
  return '<div class="sla-banner'+(R.estouradas?'':' amb')+'" role="alert">⚠ '+partes.join(' · ')+'<small>Rotas MANDALOG. Aja no GM7Driver. Cobrança por e-mail às 08h e 16h, com cópia ao gestor quando há estourada.</small></div>';
}
function abas(){var a=[['pend','Pendências'],['ind','Indicadores'],['lanc','Lançamentos']];
  return '<div class="tabs" role="tablist">'+a.map(function(x){return '<button type="button" class="tab'+(S.aba===x[0]?' on':'')+'" data-act="aba" data-aba="'+x[0]+'" role="tab" aria-selected="'+(S.aba===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';}
function pendencias(){
  var p=S.pend;
  if(!p||!p.resumo)return '<section class="card"><h2>Pendentes</h2><p class="hint">Rotas MANDALOG que exigem ação no GM7. Aguardando a primeira leitura…</p></section>';
  var lim=Math.round(p.limite_h||24),al=Math.round(p.alerta_h||16),h='';
  var todos=p.itens||[],op=S.opf||'TODAS',sit=S.sit||'TODAS';
  var itens=todos.filter(function(i){return (op==='TODAS'||(i.operacao||'SEM')===op)&&bateSit(i,sit);});
  var r=contaPend(itens),R=contaPend(todos);
  if(R.total===0)h+='<div class="sla-ok">✔ Nenhuma rota MANDALOG pendente de ação.</div>';
  var g=String(p.gerado||'');

    '<div class="chips" role="tablist" aria-label="Operação">'+OPS.map(function(o){var base=todos.filter(function(i){return o[0]==='TODAS'||(i.operacao||'SEM')===o[0];}),c=contaPend(base);
      if((o[0]==='SEM'||o[0]==='GRU_SJC')&&!c.total)return '';
      return '<button type="button" class="chip'+(op===o[0]?' on':'')+(c.estouradas?' red':'')+'" data-act="fop" data-op="'+o[0]+'" role="tab" aria-selected="'+(op===o[0])+'">'+o[1]+' <b>'+c.total+'</b>'+(c.estouradas?'<span class="dot">'+c.estouradas+' estour.</span>':'')+'</button>';}).join('')+'</div>'+
    '<div class="chips" role="tablist" aria-label="Situação">'+SITS.map(function(s){var base=todos.filter(function(i){return (op==='TODAS'||(i.operacao||'SEM')===op)&&bateSit(i,s[0]);});
      return '<button type="button" class="chip sm'+(sit===s[0]?' on':'')+'" data-act="fsit" data-sit="'+s[0]+'" role="tab" aria-selected="'+(sit===s[0])+'">'+s[1]+' <b>'+base.length+'</b></button>';}).join('')+'</div>'+
    '<div class="kpis"><div class="kpi k-est"><b>'+r.estouradas+'</b><span>Estouradas</span></div>'+

/* ---------- indicadores (a partir do histórico guardado pelo robô) ---------- */
function carregaHist(){
  if(!S.pass)return;
  fetch(HIST_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.status===200?r.json():null;}).then(function(env){
    if(!env){S.hist=null;render();return;}
    return decrypt(env,S.pass).then(function(d){S.hist=d;render();},function(){});
  }).catch(function(){});
}
function dtLocal(s){return new Date(String(s||'').replace(' ','T'));}
function pct(n,d){return d?Math.round(n*1000/d)/10:null;}
function metaCard(titulo,valor,txt,meta,ok){
  var cls=valor===null?'':(ok?' m-ok':' m-bad');
  return '<div class="mcard'+cls+'"><span class="mt">'+titulo+'</span><b>'+(valor===null?'—':txt)+'</b><span class="mm">Meta: '+meta+'</span></div>';}
function indicadores(){
  var H=S.hist;
  if(!H||!H.rotas)return '<section class="card"><h2>Indicadores</h2><p class="hint">O histórico começa a ser montado a cada leitura do robô (de hora em hora). Volte aqui depois da próxima leitura.</p></section>';
  var per=S.per||7,agora=new Date(),corte=new Date(agora.getTime()-per*86400000);
  var recs=Object.keys(H.rotas).map(function(k){return H.rotas[k];}).filter(function(r){return dtLocal(r.ref)>=corte;});
  var venc=recs.filter(function(r){return dtLocal(r.ref)<=new Date(agora.getTime()-24*3600000);});
  var ok=venc.filter(function(r){return r.finalizada&&(r.final_h==null?!r.estourou:r.final_h<=24);});
  var sla=pct(ok.length,venc.length);
  var fin=recs.filter(function(r){return r.finalizada&&r.final_h!=null;});
  var tempo=fin.length?Math.round(fin.reduce(function(a,r){return a+r.final_h;},0)/fin.length*10)/10:null;
  var sm=pct(recs.filter(function(r){return r.ja_sem_movimento;}).length,recs.length);
  var ni=recs.filter(function(r){return r.ja_nao_iniciada;}).length;
  var est=S.pend&&S.pend.itens?contaPend(S.pend.itens).estouradas:0;
  var h='<section class="card"><h2>Indicadores</h2><p class="hint">Rotas MANDALOG nos últimos '+per+' dias, a partir do histórico do robô. Meta do cliente: finalizar no mesmo dia da saída (24 h).</p>'+
    '<div class="chips">'+[7,30].map(function(d){return '<button type="button" class="chip sm'+(per===d?' on':'')+'" data-act="per" data-per="'+d+'">Últimos '+d+' dias</button>';}).join('')+'</div>'+
    '<div class="mgrid">'+
      metaCard('SLA: finalizadas em até 24 h',sla,sla+'%','≥ '+METAS.sla+'%',sla!==null&&sla>=METAS.sla)+
      metaCard('Tempo médio até finalizar',tempo,tempo+' h','≤ '+METAS.tempo+' h',tempo!==null&&tempo<=METAS.tempo)+
      metaCard('Rotas sem movimento',sm,sm+'%','≤ '+METAS.semMov+'%',sm!==null&&sm<=METAS.semMov)+
      metaCard('Atreladas e não iniciadas',recs.length?ni:null,ni+'','= '+METAS.naoIni,ni<=METAS.naoIni)+
      metaCard('Estouradas abertas agora',S.pend?est:null,est+'','= '+METAS.estouradas,est<=METAS.estouradas)+
      '<div class="mcard"><span class="mt">Rotas no período</span><b>'+recs.length+'</b><span class="mm">'+fin.length+' finalizadas</span></div>'+
    '</div></section>';
  /* tendência por dia */
  var dias={};venc.forEach(function(r){var d=String(r.ref).slice(0,10);(dias[d]=dias[d]||{n:0,ok:0});dias[d].n++;if(r.finalizada&&(r.final_h==null?!r.estourou:r.final_h<=24))dias[d].ok++;});
  var ks=Object.keys(dias).sort().slice(-14);
  if(ks.length)h+='<section class="card"><h2>SLA por dia de saída</h2><div class="bars">'+ks.map(function(d){var v=Math.round(dias[d].ok*100/dias[d].n);
    return '<div class="bar"><div class="bv" style="height:'+Math.max(4,v)+'%"><span>'+v+'%</span></div><small>'+esc(d.slice(8,10)+'/'+d.slice(5,7))+'<br>'+dias[d].n+' rotas</small></div>';}).join('')+'</div></section>';
  /* por operação */
  var nop={SUMARE:'Café Sumaré',GRU:'Café GRU',SJC:'Café SJC',GRU_SJC:'GRU / SJC (a definir)',SEM:'Sem operação'};
  var linhasOp=Object.keys(nop).map(function(op){var rr=recs.filter(function(r){return (r.operacao||'SEM')===op;});if(!rr.length)return '';
    var v=rr.filter(function(r){return venc.indexOf(r)>=0;}),o=v.filter(function(r){return ok.indexOf(r)>=0;}),s=pct(o.length,v.length);
    return '<div class="prow '+(s===null?'f-pra':(s>=METAS.sla?'f-pra':'f-est'))+'"><span class="pl">'+nop[op]+'</span><span class="w">'+rr.length+' rotas · '+rr.filter(function(r){return r.estourou;}).length+' estouraram · '+rr.filter(function(r){return r.ja_sem_movimento;}).length+' sem movimento · '+rr.filter(function(r){return r.ja_nao_iniciada;}).length+' não iniciadas</span><span class="h">'+(s===null?'—':s+'%')+'</span></div>';}).join('');
  if(linhasOp)h+='<section class="card"><h2>Por operação</h2><div class="list">'+linhasOp+'</div></section>';
  /* motoristas com dificuldade */
  var mot={};recs.forEach(function(r){var m=r.motorista||'—';var x=(mot[m]=mot[m]||{n:0,est:0,sm:0,ni:0});x.n++;if(r.estourou)x.est++;if(r.ja_sem_movimento)x.sm++;if(r.ja_nao_iniciada)x.ni++;});
  var rank=Object.keys(mot).map(function(m){var x=mot[m];return {m:m,n:x.n,est:x.est,sm:x.sm,ni:x.ni,p:x.est+x.sm+x.ni};}).filter(function(x){return x.p>0;}).sort(function(a,b){return b.p-a.p||b.n-a.n;}).slice(0,8);
  h+='<section class="card"><h2>Motoristas com mais dificuldade</h2><p class="hint">Soma de ocorrências no período: estourou o prazo, ficou sem movimento ou não foi iniciada.</p>'+
    (rank.length?'<div class="list">'+rank.map(function(x){return '<div class="prow f-est"><span class="pl">'+esc(x.m)+'</span><span class="w">'+x.n+' rota'+(x.n>1?'s':'')+' · '+x.est+' estourou · '+x.sm+' sem movimento · '+x.ni+' não iniciada</span><span class="h">'+x.p+'</span></div>';}).join('')+'</div>':'<div class="empty">Nenhuma ocorrência no período.</div>')+'</section>';
  return h;
}function agenda(){if(S.poll)clearInterval(S.poll);S.poll=setInterval(function(){if(S.view==='ok'){carrega();carregaPend();carregaHist();}},20000);}

/* ---------- envio ---------- */
function enviar(tipo,d,limpar){
  var K=(tipo==='roteirizar'||tipo==='impactar')?'msg2':'msg';
  function dize(t,ok){S[K]=t;S[K+'Ok']=ok;if(K==='msg2')S.msgOk=S.msgOk;}
  if(!S.prog.quem||!S.prog.senha){dize('Informe seu nome e a senha de programação.',false);render();return;}
  var id=novoId(),body=Object.assign({tipo:tipo,id:id,senha:S.prog.senha,quem:S.prog.quem},d);
  S.msg='';S.msg2='';
  S.busy=true;dize('Enviando…',false);render();
  fetch(WORKER_URL.replace(/\/$/,'')+'/acao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      S.busy=false;
      if(x.j&&x.j.ok){S.enviados.unshift({id:id,tipo:tipo,plano:d.plano});dize('Pedido enviado. O resultado aparece em "Andamento" em instantes.',true);S.limpar=limpar;
        [15000,35000,70000].forEach(function(t){setTimeout(carrega,t);});}
      else{dize('Não enviado: '+((x.j&&x.j.erro)||('HTTP '+x.s)),false);}
      render();})
    .catch(function(){S.busy=false;dize('Não consegui falar com o endpoint.',false);render();});
}

function guarda(){var q=document.getElementById('pQuem'),s=document.getElementById('pSenha');if(q)S.prog.quem=q.value.trim();if(s)S.prog.senha=s.value;progSet();}

    var p4=document.getElementById('iPlano').value.trim();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(p4)){S.msg2='Número do plano inválido.';S.msg2Ok=false;render();return;}
    if(!confirm('Marcar NÃO EMITIR em todas as linhas do plano '+p4+' na planilha?\nNada é apagado, só a coluna de emissão muda.'))return;
    enviar('impactar',{plano:p4},true);return;}
  if(id==='iniciarForm'){
    var p2=document.getElementById('sPlano').value.trim();
    if(!/^[A-Za-z0-9._\- ]{3,40}$/.test(p2)){S.msg='Número do plano inválido.';S.msgOk=false;render();return;}
    if(!confirm('Iniciar a rota do plano '+p2+'?\nIsso registra o início da rota no GM7 e não pode ser desfeito por aqui.'))return;
    enviar('iniciar',{plano:p2},true);}
});

S.pass=lsGet(LS_PASS);S.aba=lsGet(LS_ABA)||'pend';
if(S.pass){S.view='ok';render();carrega();carregaPend();carregaHist();agenda();}else render();
})();
</script>
